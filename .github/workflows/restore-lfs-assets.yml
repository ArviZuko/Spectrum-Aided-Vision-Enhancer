). It is stored in the [remaining-models Release](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/tag/v1.1-remaining-models) because it was not included in the curated Git tree.\\n\\n## Download\\n\\n- [model-skin-cancer-bcc-scc-sk-ak-detection-yolov10-5d6f43bc.zip](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/download/v1.1-remaining-models/model-skin-cancer-bcc-scc-sk-ak-detection-yolov10-5d6f43bc.zip) — 42.5 MiB; SHA-256 `8a1c448918d5109c203bffe51434fe71ec95a7283523f4ba7dc9508a5bc9044b`\\n\\nThe ZIP stores paths beginning with `Models/`. Extract it **at the root of the cloned repository** to restore the original model location. All parts are needed for a multipart ZIP.\\n\\nThe ZIP can be opened with Windows Explorer or extracted with your ZIP tool.\\n\",\"requiredPrefix\":\"Models/\"},{\"assets\":[{\"name\":\"model-skin-cancer-bcc-scc-sk-ak-detection-yolov11-ed16386c.zip\",\"size\":37795407,\"digest\":\"sha256:bd39be0bb97a83a59ffef60c1b7fa0e9b4ea61b7c9beb17d3b36b655c931293e\",\"url\":\"https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/download/v1.1-remaining-models/model-skin-cancer-bcc-scc-sk-ak-detection-yolov11-ed16386c.zip\"}],\"note\":\"Models/Skin Cancer/BCC, SCC, SK, AK/Detection/YOLOv11/README.md\",\"noteText\":\"# YOLOv11\\n\\nThis folder points to the remaining files for `Skin Cancer/BCC, SCC, SK, AK/Detection/YOLOv11` from the original SAVE project. The package contains **78 files** (42.1 MiB before compression). It is stored in the [remaining-models Release](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/tag/v1.1-remaining-models) because it was not included in the curated Git tree.\\n\\n## Download\\n\\n- [model-skin-cancer-bcc-scc-sk-ak-detection-yolov11-ed16386c.zip](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/download/v1.1-remaining-models/model-skin-cancer-bcc-scc-sk-ak-detection-yolov11-ed16386c.zip) — 36.0 MiB; SHA-256 `bd39be0bb97a83a59ffef60c1b7fa0e9b4ea61b7c9beb17d3b36b655c931293e`\\n\\nThe ZIP stores paths beginning with `Models/`. Extract it **at the root of the cloned repository** to restore the original model location. All parts are needed for a multipart ZIP.\\n\\nThe ZIP can be opened with Windows Explorer or extracted with your ZIP tool.\\n\",\"requiredPrefix\":\"Models/\"},{\"assets\":[{\"name\":\"model-skin-cancer-bcc-scc-sk-ak-detection-yolov8-04077dc3.zip\",\"size\":108967218,\"digest\":\"sha256:473034a7957f36e99a39c49601505d6e814f8490fd7abafea3221a03767fc2e8\",\"url\":\"https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/download/v1.1-remaining-models/model-skin-cancer-bcc-scc-sk-ak-detection-yolov8-04077dc3.zip\"}],\"note\":\"Models/Skin Cancer/BCC, SCC, SK, AK/Detection/YOLOv8/README.md\",\"noteText\":\"# YOLOv8\\n\\nThis folder points to the remaining files for `Skin Cancer/BCC, SCC, SK, AK/Detection/YOLOv8` from the original SAVE project. The package contains **178 files** (115.3 MiB before compression). It is stored in the [remaining-models Release](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/tag/v1.1-remaining-models) because it was not included in the curated Git tree.\\n\\n## Download\\n\\n- [model-skin-cancer-bcc-scc-sk-ak-detection-yolov8-04077dc3.zip](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/download/v1.1-remaining-models/model-skin-cancer-bcc-scc-sk-ak-detection-yolov8-04077dc3.zip) — 103.9 MiB; SHA-256 `473034a7957f36e99a39c49601505d6e814f8490fd7abafea3221a03767fc2e8`\\n\\nThe ZIP stores paths beginning with `Models/`. Extract it **at the root of the cloned repository** to restore the original model location. All parts are needed for a multipart ZIP.\\n\\nThe ZIP can be opened with Windows Explorer or extracted with your ZIP tool.\\n\",\"requiredPrefix\":\"Models/\"}],\"workflowPath\":\".github/workflows/restore-lfs-assets.yml\",\"originalReadme\":\"# Spectrum-Aided Vision Enhancer (SAVE)\\n\\nSAVE is a research project for turning a conventional **white-light image (WLI)** into a simulated **narrow-band-imaging-like image** and using both views in computer-aided image analysis. The project combines spectral reconstruction and color calibration with classification and detection experiments for endoscopic, bladder, and skin images. It also includes two Windows desktop applications that display the original video, the SAVE conversion, and model output side by side.\\n\\nThis repository is a **curated subset** of the original `SAVE` folder. The application, documentation, and spectral-processing source directories are represented here; selected smaller model families are included for each study group. Files over GitHub's regular Git limit are available separately in a [Release](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/tag/v1.0-large-files).\\n\\n## Idea and novelty\\n\\nConventional WLI records three broad RGB channels. The SAVE workflow described in [`Documentation/SAVE.docx`](Documentation/SAVE.docx) uses a 24-patch color chart and measured reflectance spectra to calibrate an imaging system, estimate spectral information from RGB, and select wavelength bands to produce an NBI-like view. It was designed to explore NBI-style visualization on conventional endoscopes and video capsule endoscopy (VCE), where a hardware NBI mode may be unavailable.\\n\\nThe distinctive combination in this project is:\\n\\n1. **Camera-aware spectral reconstruction:** linearize and calibrate RGB values, relate them to measured spectra in color space, then reconstruct a spectral representation using a reduced spectral basis.\\n2. **Software-defined band selection:** synthesize a SAVE image from the estimated spectral data rather than requiring a dedicated narrow-band light source. The research documents discuss the familiar blue/green NBI bands alongside additional wavelength regions for color matching.\\n3. **A practical conversion path:** the application code applies a precomputed RGB-to-SAVE lookup table (`nor_wli_nbi_table.npy`) for frame-by-frame conversion.\\n4. **WLI-versus-SAVE CAD experiments:** the model folders contain training notebooks and artifacts for comparing classification or detection on original and transformed images; the desktop interfaces show both image streams and predictions together.\\n\\nThese are the project's design and research claims, not an assertion of clinical performance. The supplied report and presentation contain the study's calibration and image-similarity results; this repository has not independently reproduced them.\\n\\n## Repository structure\\n\\n```text\\nApplications/\\n  Classification App/\\n    Source Code/          PyQt application source and local assets\\n    Dependency App/       packaged Windows application and dependencies\\n    Installer/            download link for the Windows installer\\n  Detection App/          same structure for object detection\\nDocumentation/\\n  SAVE.docx               method and evaluation write-up\\n  SAVE PPT.pptx           experiment overview and results\\n  Video.mp4               demonstration (download from Release)\\nSRC/\\n  NBI/                    spectral/color-transfer notebooks and scripts\\n  Latest_NBI/             later calibration, conversion, and evaluation notebooks\\n  SAVE/                   lookup-table generation and SAVE notebooks/assets\\nModels/\\n  README.md              links to downloadable model families not in Git\\n  Bladder Cancer/         selected classification models\\n  Endoscopic Images/      selected endoscopic-image classifiers\\n  Esophageal Cancer/      selected classification and detection models\\n  Skin Cancer/            selected lesion and cancer model groups\\n  Kvasir/                 three compact ulcer-model weights and notebooks\\n```\\n\\nThe [`SRC/NBI`](SRC/NBI), [`SRC/Latest_NBI`](SRC/Latest_NBI), and [`SRC/SAVE`](SRC/SAVE) directories contain exploratory notebooks rather than one packaged training pipeline. Some notebooks and scripts reference paths from the original research machines, so update those paths and install the imports used by the notebook before rerunning an experiment.\\n\\n## Included model selection\\n\\nTo keep a browsable repository, this upload favors compact model folders. Directory names below match the supplied project, including its spelling.\\n\\n| Study group | Included model folders or weights |\\n| --- | --- |\\n| Bladder cancer | `GOOGLNET`, `YOLOV5`, `RESNET34` |\\n| Endoscopic images | `Inception_V3`, `Logistic Regression`, `Augumented` |\\n| Esophageal cancer | `Classification/RF`, `Classification/MobileNetV2`, `Detection/Yolov8` |\\n| Skin lesions (`Acrodon`) | `YoloV10`, `YoloV5`, `YoloV8` |\\n| Melanoma (`ALM, MIS, SSM`) | `Classification/SGD_Resnet 34`, `inception-xgb`, `resnet34-lightgbm` |\\n| Other skin lesions (`BCC, SCC, SK, AK`) | `Classification/rf`, `logistic regression`, `sgd_svm` |\\n| Kvasir ulcer | `yolov8n-cls.pt`, `efficientnetB2.h5`, `Model.keras`, plus notebooks |\\n\\nWhere a selected folder contains both **WLI** and **SAVE** versions, both are retained. The other model families are available as separate ZIP downloads: browse the [additional-model index](Models/README.md), open a model's folder README, and follow its download and extraction instructions. Several original SVM weights are individually about 5–8 GB, so their archives are split into smaller Release assets.\\n\\nModel formats vary (`.pt`, `.pth`, `.pkl`, `.h5`, `.keras`). Use the notebook in the relevant model folder to see that experiment's preprocessing, labels, and framework. There is no single loader or common input contract for every model.\\n\\n## Get the files\\n\\nClone the repository with `git clone https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer.git`. GitHub does not include the 11 oversized files in the clone. Download any files you need from the [large-files Release](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/tag/v1.0-large-files) and place them at the paths below. The two installer folders contain direct download links to their installers.\\n\\n| Release asset | Original path in this project |\\n| --- | --- |\\n| `Classification-App-best.pt` | `Applications/Classification App/Dependency App/best.pt` |\\n| `Classification-App-best.pt.encrypted` | `Applications/Classification App/Dependency App/best.pt.encrypted` |\\n| `Classification-App-internal-best.pt.encrypted` | `Applications/Classification App/Dependency App/_internal/best.pt.encrypted` |\\n| `Classification-App-torch_cpu.dll` | `Applications/Classification App/Dependency App/_internal/torch/lib/torch_cpu.dll` |\\n| [Classification installer](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/download/v1.0-large-files/SAVE_Classification_App_Installer.exe) | `Applications/Classification App/Installer/SAVE_Classification_App_Installer.exe` |\\n| `Detection-App-torch_cpu.dll` | `Applications/Detection App/Dependency App/_internal/torch/lib/torch_cpu.dll` |\\n| [Detection installer](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/download/v1.0-large-files/SAVE_Detection_App_Installer.exe) | `Applications/Detection App/Installer/SAVE_Detection_App_Installer.exe` |\\n| `SAVE_Demo_Video.mp4` | `Documentation/Video.mp4` |\\n| `Endoscopic-Augmented-LR-model.pkl` | `Models/Endoscopic Images/Augumented/LR/logistic_regression_model.pkl` |\\n| `Endoscopic-Logistic-Regression-model.pkl` | `Models/Endoscopic Images/Logistic Regression/logistic_regression_model.pkl` |\\n| `SRC-SAVE-nor_wli_nbi_table.npy` | `SRC/SAVE/nor_wli_nbi_table.npy` |\\n\\nThe Release assets total about 2.3 GB. No Git LFS setup is needed.\\n\\n## Use the applications\\n\\nOn Windows, either download the [classification installer](Applications/Classification%20App/Installer/README.md) or [detection installer](Applications/Detection%20App/Installer/README.md), or download the applicable large dependencies from the table above and start the packaged application from its own `Dependency App` directory:\\n\\n```powershell\\ncd \\\"Applications\\\\Classification App\\\\Dependency App\\\"\\n.\\\\App.exe\\n```\\n\\nFor detection, use `Applications\\\\Detection App\\\\Dependency App` in the same way. The interfaces provide **Load Video**, **Start Camera**, **Pause**, and **Save** controls; the classification app also provides **Load Image Folder** and a result summary. The apps use files relative to the current working directory, including the conversion table and encrypted model. They prompt for the model password, which is **not included in this repository**. The installers have not been independently tested as part of this upload.\\n\\nThe editable PyQt entry points are [`Classification App/Source Code/App.py`](Applications/Classification%20App/Source%20Code/App.py) and [`Detection App/Source Code/App.py`](Applications/Detection%20App/Source%20Code/App.py). To run them from source, use an environment with the imports shown in those files (including OpenCV, NumPy, PyTorch, Ultralytics, Numba, and PyQt5), run from the relevant `Source Code` directory, and supply the model password. No pinned dependency or installation file is supplied, so source setup may require adapting versions and paths.\\n\\n## Research use and scope\\n\\nThe documentation covers image calibration, SAVE synthesis, and experiments across multiple datasets. This repository preserves the supplied artifacts; it does not include every original training dataset or every trained model. The models and applications have not been independently tested for diagnostic accuracy or clinical use as part of this upload.\\n\",\"updatedReadme\":\"# Spectrum-Aided Vision Enhancer (SAVE)\\n\\nSAVE is a research project for turning a conventional **white-light image (WLI)** into a simulated **narrow-band-imaging-like image** and using both views in computer-aided image analysis. The project combines spectral reconstruction and color calibration with classification and detection experiments for endoscopic, bladder, and skin images. It also includes two Windows desktop applications that display the original video, the SAVE conversion, and model output side by side.\\n\\nThis repository preserves the supplied applications, documentation, spectral-processing sources, and model artifacts. Release-hosted artifacts that fit GitHub's per-file LFS limit are restored to their original folders, with large files stored through Git LFS. Oversized originals remain available in Releases; see the [model index](Models/README.md) for their download instructions.\\n\\n## Idea and novelty\\n\\nConventional WLI records three broad RGB channels. The SAVE workflow described in [`Documentation/SAVE.docx`](Documentation/SAVE.docx) uses a 24-patch color chart and measured reflectance spectra to calibrate an imaging system, estimate spectral information from RGB, and select wavelength bands to produce an NBI-like view. It was designed to explore NBI-style visualization on conventional endoscopes and video capsule endoscopy (VCE), where a hardware NBI mode may be unavailable.\\n\\nThe distinctive combination in this project is:\\n\\n1. **Camera-aware spectral reconstruction:** linearize and calibrate RGB values, relate them to measured spectra in color space, then reconstruct a spectral representation using a reduced spectral basis.\\n2. **Software-defined band selection:** synthesize a SAVE image from the estimated spectral data rather than requiring a dedicated narrow-band light source. The research documents discuss the familiar blue/green NBI bands alongside additional wavelength regions for color matching.\\n3. **A practical conversion path:** the application code applies a precomputed RGB-to-SAVE lookup table (`nor_wli_nbi_table.npy`) for frame-by-frame conversion.\\n4. **WLI-versus-SAVE CAD experiments:** the model folders contain training notebooks and artifacts for comparing classification or detection on original and transformed images; the desktop interfaces show both image streams and predictions together.\\n\\nThese are the project's design and research claims, not an assertion of clinical performance. The supplied report and presentation contain the study's calibration and image-similarity results; this repository has not independently reproduced them.\\n\\n## Repository structure\\n\\n```text\\nApplications/\\n  Classification App/\\n    Source Code/          PyQt application source and local assets\\n    Dependency App/       packaged Windows application and dependencies\\n    Installer/            Windows installer (Git LFS)\\n  Detection App/          same structure for object detection\\nDocumentation/\\n  SAVE.docx               method and evaluation write-up\\n  SAVE PPT.pptx           experiment overview and results\\n  Video.mp4               demonstration (Git LFS)\\nSRC/\\n  NBI/                    spectral/color-transfer notebooks and scripts\\n  Latest_NBI/             later calibration, conversion, and evaluation notebooks\\n  SAVE/                   lookup-table generation and SAVE notebooks/assets\\nModels/\\n  README.md              model information and oversized-file download notes\\n  Bladder Cancer/         classification models\\n  Endoscopic Images/      endoscopic-image classifiers\\n  Esophageal Cancer/      classification and detection models\\n  Skin Cancer/            lesion and cancer model groups\\n  Kvasir/                 ulcer-model weights and notebooks\\n```\\n\\nThe [`SRC/NBI`](SRC/NBI), [`SRC/Latest_NBI`](SRC/Latest_NBI), and [`SRC/SAVE`](SRC/SAVE) directories contain exploratory notebooks rather than one packaged training pipeline. Some notebooks and scripts reference paths from the original research machines, so update those paths and install the imports used by the notebook before rerunning an experiment.\\n\\n## Model artifacts\\n\\nThe supplied model families and Kvasir artifacts are restored at their original `Models/...` paths wherever individual files fit GitHub's LFS limit. Where a model folder contains both **WLI** and **SAVE** versions, both are retained. Large original weights that exceed the LFS limit remain available through the [model index](Models/README.md) and the corresponding folder notes.\\n\\nModel formats vary (`.pt`, `.pth`, `.pkl`, `.h5`, `.keras`). Use the notebook in the relevant model folder to see that experiment's preprocessing, labels, and framework. There is no single loader or common input contract for every model.\\n\\n## Get the files\\n\\nInstall Git LFS before cloning to retrieve the installers, large dependencies, calibration table, video, and supported model weights in their original folders:\\n\\n```bash\\ngit lfs install\\ngit clone https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer.git\\ncd Spectrum-Aided-Vision-Enhancer\\ngit lfs pull\\n```\\n\\nSome original model files exceed GitHub's LFS per-file size limit. Those files remain in the [remaining-models Release](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/tag/v1.1-remaining-models), with download and extraction instructions in [Models/README.md](Models/README.md).\\n\\n## Use the applications\\n\\nOn Windows, use the [classification installer](Applications/Classification%20App/Installer/SAVE_Classification_App_Installer.exe) or [detection installer](Applications/Detection%20App/Installer/SAVE_Detection_App_Installer.exe), or retrieve the application dependencies with Git LFS and start the packaged application from its own `Dependency App` directory:\\n\\n```powershell\\ncd \\\"Applications\\\\Classification App\\\\Dependency App\\\"\\n.\\\\App.exe\\n```\\n\\nFor detection, use `Applications\\\\Detection App\\\\Dependency App` in the same way. The interfaces provide **Load Video**, **Start Camera**, **Pause**, and **Save** controls; the classification app also provides **Load Image Folder** and a result summary. The apps use files relative to the current working directory, including the conversion table and encrypted model. They prompt for the model password, which is **not included in this repository**. The installers have not been independently tested as part of this upload.\\n\\nThe editable PyQt entry points are [`Classification App/Source Code/App.py`](Applications/Classification%20App/Source%20Code/App.py) and [`Detection App/Source Code/App.py`](Applications/Detection%20App/Source%20Code/App.py). To run them from source, use an environment with the imports shown in those files (including OpenCV, NumPy, PyTorch, Ultralytics, Numba, and PyQt5), run from the relevant `Source Code` directory, and supply the model password. No pinned dependency or installation file is supplied, so source setup may require adapting versions and paths.\\n\\n## Research use and scope\\n\\nThe documentation covers image calibration, SAVE synthesis, and experiments across multiple datasets. This repository preserves the supplied artifacts; it does not include every original training dataset. Oversized model files are preserved in Releases. The models and applications have not been independently tested for diagnostic accuracy or clinical use as part of this upload.\\n\",\"modelsIndex\":{\"original\":\"# Additional downloadable SAVE models\\n\\nThe curated Git tree includes selected compact models. The folders below link to separate ZIP packages for the remaining model families and Kvasir weights. Each ZIP contains the original `Models/...` paths; extract it at the repository root. Multipart packages provide all parts and joining instructions in their folder README.\\n\\n[Browse all packages in the Release](https://github.com/ArviZuko/Spectrum-Aided-Vision-Enhancer/releases/tag/v1.1-remaining-models).\\n\\n## Bladder Cancer\\n\\n| Model folder or file | Original size |\\n| --- | ---: |\\n| [INCEPTIONRESNETV2](Bladder%20Cancer/INCEPTIONRESNETV2/README.md) | 467.8 MiB |\\n| [VGG16](Bladder%20Cancer/VGG16/README.md) | 712.7 MiB |\\n\\n## Endoscopic Images\\n\\n| Model folder or file | Original size |\\n| --- | ---: |\\n| [Additional spreadsheet](Endoscopic%20Images/Additional%20Files/README.md) | 2.5 MiB |\\n| [Yolov8](Endoscopic%20Images/Yolov8/README.md) | 447.1 MiB |\\n\\n## Esophageal Cancer\\n\\n| Model folder or file | Original size |\\n| --- | ---: |\\n| [Classification/CNN](Esophageal%20Cancer/Classification/CNN/README.md) | 279.3 MiB |\\n| [Classification/InceptionV3](Esophageal%20Cancer/Classification/InceptionV3/README.md) | 172.3 MiB |\\n| [Classification/Logistics Regression](Esophageal%20Cancer/Classification/Logistics%20Regression/README.md) | 14.7 MiB |\\n| [Classification/SVM](Esophageal%20Cancer/Classification/SVM/README.md) | 14.71 GiB |\\n| [Classification/VGG16](Esophageal%20Cancer/Classification/VGG16/README.md) | 234.0 MiB |\\n| [Classification/YOLOv8n](Esophageal%20Cancer/Classification/YOLOv8n/README.md) | 42.2 MiB |\\n| [Classification/Yolov8x](Esophageal%20Cancer/Classification/Yolov8x/README.md) | 442.4 MiB |\\n| [Detection/RT-DETR](Esophageal%20Cancer/Detection/RT-DETR/README.md) | 1.30 GiB |\\n| [Detection/YOLOR](Esophageal%20Cancer/Detection/YOLOR/README.md) | 1.45 GiB |\\n| [Detection/Yolov10](Esophageal%20Cancer/Detection/Yolov10/README.md) | 458.3 MiB |\\n| [Detection/YoloV3](Esophageal%20Cancer/Detection/YoloV3/README.md) | 1.69 GiB |\\n| [Detection/YOLOV4](Esophageal%20Cancer/Detection/YOLOV4/README.md) | 1.92 GiB |\\n| [Detection/Yolov5](Esophageal%20Cancer/Detection/Yolov5/README.md) | 100.2 MiB |\\n| [Detection/YOLOv6](Esophageal%20Cancer/Detection/YOLOv6/README.md) | 1.03 GiB |\\n| [Detection/YOLOV7](Esophageal%20Cancer/Detection/YOLOV7/README.md) | 519.1 MiB |\\n| [Detection/Yolov9](Esophageal%20Cancer/Detection/Yolov9/README.md) | 2.05 GiB |\\n\\n## Kvasir\\n\\n| Model folder or file | Original size |\\n| --- | ---: |\\n| [Models/Ulcer/best_alexnet_model.keras](Kvasir/Models/Ulcer/Downloads/best-alexnet-model-c8008f/README.md) | 535.2 MiB |\\n| [Models/Ulcer/best